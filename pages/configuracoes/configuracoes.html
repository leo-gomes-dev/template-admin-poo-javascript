<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurações | Escola Fullstack JavaScript</title>
    <link rel="stylesheet" href="../../styles/dashboard-base.css" />
    <link rel="stylesheet" href="configuracoes.css" />
  </head>
  <body>
    <div class="dashboard-container">
      <aside class="sidebar">
        <div class="profile-section">
          <div class="avatar">AN</div>
          <div class="profile-info">
            <h4>Leo Gomes</h4>
            <span class="status-online"
              ><i class="fa-solid fa-circle"></i> Online</span
            >
          </div>
        </div>
        <nav class="menu">
          <p class="menu-title">NAVEGAÇÃO PRINCIPAL</p>
          <a href="../dashboard/dashboard.html" class="menu-item"
            ><i class="fa-solid fa-gauge"></i> Dashboard</a
          >
          <a href="../usuarios/usuarios.html" class="menu-item"
            ><i class="fa-solid fa-users"></i> Usuários</a
          >
          <a href="../produtos/produtos.html" class="menu-item"
            ><i class="fa-solid fa-box"></i> Produtos</a
          >
          <a
            href="configuracoes.html"
            class="menu-item active"
            aria-current="page"
            ><i class="fa-solid fa-gear"></i> Configurações</a
          >
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="topbar-left">
            <button class="toggle-btn" type="button" aria-label="Alternar menu">
              ☰
            </button>
            <span><b>Admin</b>LTE</span>
          </div>
          <div>
            <a href="../../index.html" id="logout-btn" class="logout-link"
              ><i class="fa-solid fa-sign-out-alt"></i> Sair</a
            >
          </div>
        </header>

        <div class="content-header">
          <h1>Configurações <small>Preferências do Sistema</small></h1>
          <div class="breadcrumb">
            <span><i class="fa-solid fa-gauge"></i> Home</span> / Configurações
          </div>
        </div>

        <div class="config-container">
          <section class="box border-top-orange">
            <div class="box-header"><h3>Ajustes Globais</h3></div>
            <form id="config-form" class="box-body">
              <div class="form-group">
                <label for="config-app-name">Nome da Empresa / Aplicação</label>
                <input
                  type="text"
                  id="config-app-name"
                  value="Minha Escola Fullstack"
                />
              </div>
              <div class="form-group">
                <label for="config-theme">Modo de Exibição</label>
                <select id="config-theme">
                  <option value="light">Claro Padrão</option>
                  <option value="dark">Modo Noturno Escuro</option>
                </select>
              </div>
              <div class="form-group">
                <label
                  ><input type="checkbox" id="config-notifications" checked />
                  Ativar alertas de novos cadastros</label
                >
              </div>
              <button type="submit" class="btn-submit bg-orange">
                Salvar Preferências
              </button>
            </form>
          </section>
        </div>
      </main>
    </div>

    <footer class="professor-footer">
      <p>
        Painel de estudos por: <strong>Leo Gomes Developer</strong> |
        <a href="https://leogomesdev.com" target="_blank">leogomesdev.com</a>
      </p>
    </footer>
    <script src="../../scripts/main.js" defer></script>
  </body>
</html>
